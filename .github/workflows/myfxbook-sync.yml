name: Sync Tetrarch Myfxbook data

on:
  workflow_dispatch:
  schedule:
    # Check every 4 hours; Auto Update availability is controlled by Myfxbook.
    # 00:15, 04:15, 08:15, 12:15, 16:15, 20:15 UTC.
    # Argentina (GMT-3): 21:15, 01:15, 05:15, 09:15, 13:15, 17:15.
    - cron: "15 */4 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synchronize Myfxbook
        env:
          MYFXBOOK_EMAIL: ${{ secrets.MYFXBOOK_EMAIL }}
          MYFXBOOK_PASSWORD: ${{ secrets.MYFXBOOK_PASSWORD }}
          MYFXBOOK_ACCOUNT_ID: "12278068"
        run: python scripts/sync_myfxbook.py
      - name: Commit synchronized data
        run: |
          git config user.name "tetrarch-results-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/account.json data/trades.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync Myfxbook account data"
            git push
          else
            echo "No data changes to commit"
          fi
